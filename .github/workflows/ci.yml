name: CI SmOrg Mobile

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Qualidade de Código
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar e Cache do Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Dar permissão de execução ao Gradle Wrapper
        run: chmod +x gradlew

      - name: Análise Estática (ktlint e detekt)
        run: ./gradlew ktlintCheck detekt --continue

      - name: Compilar App Android (assembleDebug)
        run: ./gradlew assembleDebug
